name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.4.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'v1.4.0' }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and package VSIX
        run: npm run package:vsix

      - name: Resolve package filename
        run: |
          VSIX_NAME="$(find . -maxdepth 1 -type f -name 'trae-use-token-*.vsix' -print -quit)"
          test -n "$VSIX_NAME"
          echo "VSIX_NAME=$VSIX_NAME" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$VSIX_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "$VSIX_NAME" \
              --title "Trae Use Token $RELEASE_TAG" \
              --notes "正式版。安装后无需重启即可记录 TRAE 实际积分变化；可选启用详细 Token 监听以采集逐次 Token、缓存和模型明细。若 TRAE 商店暂时未同步，可下载本页 VSIX 后选择‘从 VSIX 安装’。" \
              --latest
          fi
