name: Publish Open VSX

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-open-vsx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Test extension
        run: npm run check

      - name: Ensure Open VSX namespace exists
        env:
          TRAE_USE_TOKEN_OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" https://open-vsx.org/api/firerl || true)
          if [ "$status" = "404" ]; then
            npx --yes ovsx@1.1.0 create-namespace firerl -p "$TRAE_USE_TOKEN_OVSX_PAT"
          elif [ "$status" != "200" ]; then
            echo "Unable to verify Open VSX namespace (HTTP $status)" >&2
            exit 1
          fi

      - name: Publish to Open VSX
        uses: HaaLeo/publish-vscode-extension@ca5561daa085dee804bf9f37fe0165785a9b14db # v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
