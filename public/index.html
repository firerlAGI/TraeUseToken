<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trae Use Token</title>
  <style>
    :root{color-scheme:dark;--bg:#090c10;--panel:#11161d;--line:#232b36;--text:#edf3f8;--muted:#83909f;--green:#27d98b;--blue:#62a8ff;--amber:#ffbd5b}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#173024 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}main{max-width:1180px;margin:auto;padding:32px 22px 60px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}h1{font-size:25px;margin:0 0 4px;letter-spacing:-.03em}.sub,.status,.range-caption{color:var(--muted)}.status{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#5d6671}.dot.on{background:var(--green);box-shadow:0 0 14px #27d98b99}
    .range-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.range-tabs{display:inline-flex;gap:3px;padding:3px;background:#11161de8;border:1px solid var(--line);border-radius:9px}.range-tab{min-height:34px;color:var(--muted);background:transparent;border:0;border-radius:6px;padding:6px 14px;font:600 13px/1.5 inherit;cursor:pointer;transition:background-color .16s ease,color .16s ease}.range-tab:hover{color:var(--text);background:#202730}.range-tab[aria-selected="true"]{color:#07110d;background:var(--green)}.range-tab:focus-visible,.button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.range-caption{font-size:12px}.range-caption[data-loading="true"]::after{content:' · 更新中';color:var(--green)}
    .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#11161de8;border:1px solid var(--line);border-radius:14px}.card{padding:17px}.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:680;margin-top:7px;letter-spacing:-.03em}.unit{color:var(--muted);font-size:12px;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1.65fr;gap:12px;margin-top:12px}.panel{padding:18px;overflow:hidden}h2{font-size:14px;margin:0 0 16px}.model{display:grid;grid-template-columns:128px 1fr 62px;gap:10px;align-items:center;margin:11px 0}.model-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:7px;background:#202730;border-radius:9px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:9px}.model-total{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    .grid,.panel{min-width:0}.table-wrap{max-height:clamp(320px,52vh,560px);overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border-block:1px solid var(--line)}.table-wrap:focus-visible{outline:2px solid var(--blue);outline-offset:2px}table{width:100%;min-width:640px;border-collapse:collapse;font-variant-numeric:tabular-nums}thead{position:sticky;top:0;z-index:2}th{color:var(--muted);background:var(--panel);font-weight:500;font-size:11px;text-align:right;padding:10px 9px;box-shadow:0 1px 0 var(--line)}th:first-child,td:first-child{text-align:left}td{text-align:right;border-top:1px solid var(--line);padding:11px 9px;white-space:nowrap}tbody tr:hover{background:#171d25}.model-cell{text-align:left;font-weight:600}.actual{color:var(--green)}.estimated{color:var(--amber)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px}.toolbar h2{margin:0}.button{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:8px;background:#151b23}.legend{color:var(--muted);font-size:12px;margin-top:12px}.empty{color:var(--muted);padding:25px 0;text-align:center}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:820px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}.range-bar{align-items:flex-start;flex-direction:column}.range-tabs{display:grid;grid-template-columns:repeat(2,1fr);width:100%}.range-tab{min-height:40px}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main aria-busy="false">
  <header><div><h1>Trae Use Token</h1><div class="sub">本地 Token、缓存与积分观测</div></div><div class="status"><span id="dot" class="dot"></span><span id="status">正在连接</span></div></header>
  <nav class="range-bar" aria-label="统计时间范围"><div class="range-tabs" role="tablist"><button class="range-tab" role="tab" data-range="day" aria-selected="true">今日</button><button class="range-tab" role="tab" data-range="week" aria-selected="false">本周</button><button class="range-tab" role="tab" data-range="month" aria-selected="false">本月</button><button class="range-tab" role="tab" data-range="all" aria-selected="false">全部记录</button></div><span id="rangeCaption" class="range-caption">显示今天 00:00 至今</span></nav>
  <section class="cards"><div class="card"><div class="label">调用次数</div><div class="value" id="calls">0</div></div><div class="card"><div class="label">总词元</div><div class="value" id="tokens">0</div></div><div class="card"><div class="label">缓存命中率</div><div class="value" id="cache">0<span class="unit">%</span></div></div><div class="card"><div class="label">积分</div><div class="value" id="credits">0</div></div></section>
  <section class="grid"><div class="panel"><h2>按模型用量</h2><div id="models" class="empty">暂无数据</div></div><div class="panel"><h2>调用记录</h2><div class="table-wrap" tabindex="0" role="region" aria-label="调用记录，可滚动"><table><thead><tr><th>时间</th><th>模型</th><th>输入</th><th>输出</th><th>缓存</th><th>积分</th></tr></thead><tbody id="recent"></tbody></table></div><div class="legend"><span class="actual">● 实际积分</span>　<span class="estimated">● 估算积分</span></div></div></section>
  <div class="toolbar"><h2>所有记录仅保存在本机 SQLite</h2><a id="export" class="button" href="/api/export.csv?range=day">导出当前范围 CSV</a></div>
  <div class="sub">估算值使用本机实验校准公式，不代表 TRAE 官方账单；不会保存提示词或回答正文。</div>
</main><script>
const fmt=new Intl.NumberFormat('zh-CN'),dateFmt=new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),num=v=>fmt.format(Math.round(Number(v)||0)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let activeRange='day',refreshVersion=0;const captions={day:'显示今天 00:00 至今',week:'显示本周一 00:00 至今',month:'显示本月 1 日 00:00 至今',all:'显示全部历史记录'};
function selectRange(range){activeRange=['day','week','month','all'].includes(range)?range:'day';document.querySelectorAll('.range-tab').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.range===activeRange)));document.querySelector('#rangeCaption').textContent=captions[activeRange];document.querySelector('#export').href=`/api/export.csv?range=${activeRange}`;refresh().catch(console.error)}
async function refresh(){const version=++refreshVersion,range=encodeURIComponent(activeRange),limit=activeRange==='all'?500:200,main=document.querySelector('main'),caption=document.querySelector('#rangeCaption');main.setAttribute('aria-busy','true');caption.dataset.loading='true';try{const [summary,calls,health]=await Promise.all([`/api/summary?range=${range}`,`/api/calls?limit=${limit}&range=${range}`,'/api/health'].map(url=>fetch(url).then(response=>response.json())));if(version!==refreshVersion)return;const total=summary.total;document.querySelector('#calls').textContent=num(total.calls);document.querySelector('#tokens').textContent=num(total.total_tokens);const rate=total.prompt_tokens?100*total.cached_tokens/total.prompt_tokens:0;document.querySelector('#cache').innerHTML=`${rate.toFixed(1)}<span class="unit">%</span>`;const actual=Number(total.actual_credits)||0,estimated=Number(total.estimated_credits)||0,hasCredits=actual||estimated;document.querySelector('#credits').innerHTML=hasCredits?`${(actual+estimated).toFixed(2)} <span class="unit">${actual&&estimated?'混合':actual?'实际':'估算'}</span>`:total.calls?'— <span class="unit">不适用</span>':'0.00 <span class="unit">—</span>';const max=Math.max(1,...summary.models.map(item=>item.total_tokens));document.querySelector('#models').className='';document.querySelector('#models').innerHTML=summary.models.length?summary.models.map(model=>`<div class="model"><div class="model-name" title="${esc(model.model)}">${esc(model.model)}</div><div class="track"><div class="bar" style="width:${100*model.total_tokens/max}%"></div></div><div class="model-total">${num(model.total_tokens)}</div></div>`).join(''):'<div class="empty">当前范围暂无数据</div>';document.querySelector('#recent').innerHTML=calls.map(call=>`<tr><td>${dateFmt.format(new Date(call.observed_at))}</td><td class="model-cell">${esc(call.model)}</td><td>${num(call.prompt_tokens)}</td><td>${num(call.completion_tokens)}</td><td>${num(call.cached_tokens)}</td><td class="${esc(call.credit_kind)}">${call.credits==null?'—':Number(call.credits).toFixed(3)}</td></tr>`).join('');const ready=health.cdpConnected||health.nativeAvailable;document.querySelector('#dot').classList.toggle('on',ready);document.querySelector('#status').textContent=health.mode==='mock'?'演示模式':health.cdpConnected?(health.breakpointCount>0?`详细监听已就绪 · ${health.breakpointCount} 个采集点`:'已连接，正在定位采集点'):health.nativeAvailable?'免重启调用监听已就绪':'等待可用监听接口'}finally{if(version===refreshVersion){main.setAttribute('aria-busy','false');caption.dataset.loading='false'}}}
document.querySelectorAll('.range-tab').forEach(button=>button.onclick=()=>selectRange(button.dataset.range));refresh().catch(console.error);const events=new EventSource('/api/events');events.addEventListener('call',()=>refresh());events.addEventListener('status',()=>refresh());events.onerror=()=>setTimeout(refresh,1500);setInterval(refresh,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
