<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRAE Usage Monitor</title>
  <style>
    :root { color-scheme: dark; --bg:#090c10; --panel:#11161d; --line:#232b36; --text:#edf3f8; --muted:#83909f; --green:#27d98b; --blue:#62a8ff; --amber:#ffbd5b; }
    * { box-sizing:border-box; }
    body { margin:0; background:radial-gradient(circle at 15% -10%,#173024 0,transparent 30%),var(--bg); color:var(--text); font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; }
    main { max-width:1180px; margin:auto; padding:32px 22px 60px; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:24px; }
    h1 { font-size:25px; margin:0 0 4px; letter-spacing:-.03em; } .sub { color:var(--muted); }
    .status { display:flex; align-items:center; gap:8px; color:var(--muted); } .dot { width:9px; height:9px; border-radius:50%; background:#5d6671; }.dot.on{background:var(--green);box-shadow:0 0 14px #27d98b99}
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
    .card,.panel { background:#11161de8; border:1px solid var(--line); border-radius:14px; }
    .card { padding:17px; } .label { color:var(--muted); font-size:12px; } .value { font-size:25px; font-weight:680; margin-top:7px; letter-spacing:-.03em; } .unit { color:var(--muted); font-size:12px; font-weight:400; }
    .grid { display:grid; grid-template-columns:1fr 1.55fr; gap:12px; margin-top:12px; }
    .panel { padding:18px; overflow:hidden; } h2 { font-size:14px; margin:0 0 16px; }
    .model { display:grid; grid-template-columns:128px 1fr 62px; gap:10px; align-items:center; margin:11px 0; }.model-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:7px;background:#202730;border-radius:9px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:9px}.model-total{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; } th { color:var(--muted); font-weight:500; font-size:11px; text-align:right; padding:0 9px 10px; } th:first-child,td:first-child{text-align:left} td { text-align:right; border-top:1px solid var(--line); padding:11px 9px; white-space:nowrap; }.model-cell{font-weight:600}.actual{color:var(--green)}.estimated{color:var(--amber)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 10px}.toolbar h2{margin:0}.button{color:var(--text);text-decoration:none;border:1px solid var(--line);padding:7px 11px;border-radius:8px;background:#151b23}.legend{color:var(--muted);font-size:12px;margin-top:12px}.empty{color:var(--muted);padding:25px 0;text-align:center}
    @media(max-width:820px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.table-wrap{overflow:auto}} @media(max-width:480px){.cards{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main>
  <header><div><h1>TRAE Usage Monitor</h1><div class="sub">本地 Token、缓存与积分观测</div></div><div class="status"><span id="dot" class="dot"></span><span id="status">正在连接</span></div></header>
  <section class="cards">
    <div class="card"><div class="label">调用次数</div><div class="value" id="calls">0</div></div>
    <div class="card"><div class="label">总词元</div><div class="value" id="tokens">0</div></div>
    <div class="card"><div class="label">缓存命中率</div><div class="value" id="cache">0<span class="unit">%</span></div></div>
    <div class="card"><div class="label">积分</div><div class="value" id="credits">0</div></div>
  </section>
  <section class="grid">
    <div class="panel"><h2>按模型用量</h2><div id="models" class="empty">暂无数据</div></div>
    <div class="panel"><h2>最近调用</h2><div class="table-wrap"><table><thead><tr><th>模型</th><th>输入</th><th>输出</th><th>缓存</th><th>积分</th></tr></thead><tbody id="recent"></tbody></table></div><div class="legend"><span class="actual">● 实际积分</span>　<span class="estimated">● 估算积分</span></div></div>
  </section>
  <div class="toolbar"><h2>所有记录仅保存在本机 SQLite</h2><a class="button" href="/api/export.csv">导出 CSV</a></div>
  <div class="sub">估算值使用本机实验校准公式，不代表 TRAE 官方账单；不会保存提示词或回答正文。</div>
</main><script>
const fmt = new Intl.NumberFormat('zh-CN');
const num = v => fmt.format(Math.round(Number(v)||0));
const esc = value => String(value ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){
  const [summary,calls,health]=await Promise.all(['/api/summary','/api/calls?limit=30','/api/health'].map(u=>fetch(u).then(r=>r.json())));
  const t=summary.total; document.querySelector('#calls').textContent=num(t.calls); document.querySelector('#tokens').textContent=num(t.total_tokens);
  const rate=t.prompt_tokens?100*t.cached_tokens/t.prompt_tokens:0; document.querySelector('#cache').innerHTML=`${rate.toFixed(1)}<span class="unit">%</span>`;
  const actual=Number(t.actual_credits)||0, estimated=Number(t.estimated_credits)||0; document.querySelector('#credits').innerHTML=`${(actual+estimated).toFixed(2)} <span class="unit">${actual&&estimated?'混合':actual?'实际':'估算'}</span>`;
  const max=Math.max(1,...summary.models.map(x=>x.total_tokens)); document.querySelector('#models').className=''; document.querySelector('#models').innerHTML=summary.models.length?summary.models.map(m=>`<div class="model"><div class="model-name" title="${esc(m.model)}">${esc(m.model)}</div><div class="track"><div class="bar" style="width:${100*m.total_tokens/max}%"></div></div><div class="model-total">${num(m.total_tokens)}</div></div>`).join(''):'<div class="empty">暂无数据</div>';
  document.querySelector('#recent').innerHTML=calls.map(c=>`<tr><td class="model-cell">${esc(c.model)}</td><td>${num(c.prompt_tokens)}</td><td>${num(c.completion_tokens)}</td><td>${num(c.cached_tokens)}</td><td class="${esc(c.credit_kind)}">${c.credits==null?'—':Number(c.credits).toFixed(3)}</td></tr>`).join('');
  const ready=health.cdpConnected&&(health.breakpointCount>0||health.lastUsageAt);
  document.querySelector('#dot').classList.toggle('on',ready);
  document.querySelector('#status').textContent=health.mode==='mock'?'演示模式':!health.cdpConnected?'等待 TRAE CDP':ready?(health.breakpointCount>0?`已就绪 · ${health.breakpointCount} 个采集点`:'已就绪 · 已捕获用量'):'已连接，正在定位采集点';
}
refresh().catch(console.error); const events=new EventSource('/api/events'); events.addEventListener('call',()=>refresh()); events.addEventListener('status',()=>refresh()); events.onerror=()=>setTimeout(refresh,1500); setInterval(refresh,3000); document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
